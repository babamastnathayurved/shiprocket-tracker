<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shiprocket Operations Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8">

  <div class="max-w-7xl mx-auto space-y-6">
    <div class="flex justify-between items-center bg-slate-900 border border-slate-800 p-6 rounded-2xl">
      <div>
        <h1 class="text-2xl font-bold text-white"><i class="fa-solid fa-truck-fast text-indigo-500"></i> NDR & On-Hold Tracker</h1>
        <p class="text-slate-400 text-sm mt-1">Live tracking portal</p>
      </div>
      <button onclick="loadData()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-semibold">Refresh Data</button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
        <p class="text-slate-400 text-sm">Total Flagged</p>
        <p id="stat-total" class="text-3xl font-bold text-white mt-1">0</p>
      </div>
      <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl border-l-4 border-l-rose-500">
        <p class="text-slate-400 text-sm">NDR Orders</p>
        <p id="stat-ndr" class="text-3xl font-bold text-rose-400 mt-1">0</p>
      </div>
      <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl border-l-4 border-l-amber-500">
        <p class="text-slate-400 text-sm">On-Hold Orders</p>
        <p id="stat-hold" class="text-3xl font-bold text-amber-400 mt-1">0</p>
      </div>
    </div>

    <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden">
      <div class="p-4 border-b border-slate-800 flex flex-col md:flex-row gap-4 justify-between">
        <input type="text" id="search" oninput="filterData()" placeholder="Search Order ID, Phone, AWB..." class="bg-slate-950 border border-slate-800 px-4 py-2 rounded-xl text-sm w-full md:w-80">
        <select id="filter-type" onchange="filterData()" class="bg-slate-950 border border-slate-800 px-4 py-2 rounded-xl text-sm">
          <option value="ALL">All Statuses</option>
          <option value="NDR">NDR Only</option>
          <option value="ON HOLD">On-Hold Only</option>
        </select>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-300">
          <thead class="bg-slate-950 text-slate-400 uppercase text-xs">
            <tr>
              <th class="p-4">Order ID</th>
              <th class="p-4">Customer</th>
              <th class="p-4">Status</th>
              <th class="p-4">Courier / AWB</th>
              <th class="p-4">Reason</th>
              <th class="p-4 text-center">Action</th>
            </tr>
          </thead>
          <tbody id="table-body" class="divide-y divide-slate-800"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://itpcbbjevqwhzqxjdmgy.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml0cGNiYmpldnF3aHpxeGpkbWd5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxNDQyMTcsImV4cCI6MjEwNTcyMDIxN30.vDRFCoOIOXmjrPVjCj_c7skBZTWS7u_2pHJIvHW83co";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let allOrders = [];

    async function loadData() {
      const { data, error } = await supabase.from('shiprocket_orders').select('*').order('updated_at', { ascending: false });
      if (error) return console.error(error);
      allOrders = data || [];
      document.getElementById('stat-total').innerText = allOrders.length;
      document.getElementById('stat-ndr').innerText = allOrders.filter(o => o.status === 'NDR').length;
      document.getElementById('stat-hold').innerText = allOrders.filter(o => o.is_on_hold || o.status === 'ON HOLD').length;
      filterData();
    }

    function filterData() {
      const query = document.getElementById('search').value.toLowerCase();
      const filter = document.getElementById('filter-type').value;

      const filtered = allOrders.filter(o => {
        const matchesSearch = (o.order_id && o.order_id.toLowerCase().includes(query)) || 
                              (o.customer_phone && o.customer_phone.toLowerCase().includes(query)) ||
                              (o.awb_code && o.awb_code.toLowerCase().includes(query));
        const matchesFilter = filter === 'ALL' || o.status === filter;
        return matchesSearch && matchesFilter;
      });

      const tbody = document.getElementById('table-body');
      tbody.innerHTML = filtered.map(o => {
        const phone = (o.customer_phone || '').replace(/[^0-9]/g, '');
        const waLink = phone ? `https://wa.me/91${phone.slice(-10)}?text=Hi%20${encodeURIComponent(o.customer_name || '')},%20regarding%20your%20order%20%23${encodeURIComponent(o.order_id)}.` : '#';

        return `
          <tr class="hover:bg-slate-800/50">
            <td class="p-4 font-mono font-bold text-white">${o.order_id}</td>
            <td class="p-4">${o.customer_name}<br><span class="text-xs text-slate-500">${o.customer_phone}</span></td>
            <td class="p-4"><span class="px-2.5 py-1 rounded-full text-xs font-bold ${o.status === 'NDR' ? 'bg-rose-500/10 text-rose-400' : 'bg-amber-500/10 text-amber-400'}">${o.status}</span></td>
            <td class="p-4">${o.courier_name}<br><span class="text-xs text-slate-500 font-mono">${o.awb_code}</span></td>
            <td class="p-4 text-xs text-slate-400">${o.ndr_reason}</td>
            <td class="p-4 text-center">
              ${phone ? `<a href="${waLink}" target="_blank" class="px-3 py-1.5 bg-emerald-600/20 text-emerald-400 border border-emerald-500/30 rounded-lg text-xs font-semibold"><i class="fa-brands fa-whatsapp"></i> Contact</a>` : ''}
            </td>
          </tr>
        `;
      }).join('');
    }

    loadData();
  </script>
</body>
</html>
